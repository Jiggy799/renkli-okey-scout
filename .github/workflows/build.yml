name: Build APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Flutter SDK
        run: |
          cd /opt
          wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.4-stable.tar.xz -O flutter.tar.xz
          tar xf flutter.tar.xz
          rm flutter.tar.xz

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          yes | /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Configure Flutter
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          flutter config --android-sdk $ANDROID_HOME --no-analytics
          flutter doctor --android-licenses < /dev/null || true

      - name: Get dependencies
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          flutter pub get

      - name: Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          JAVA_HOME: /opt/java/openjdk
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renkli-okey-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
